[package]
name = "ocpi"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
ocpi-protocol = { package = "ocpi", version = "0.3" }
serde_json = "1"
anyhow = "1"
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
